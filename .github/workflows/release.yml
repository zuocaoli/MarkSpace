# 仅 push tag v* 触发：三平台 release 构建 → 归档 → 汇总发布
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: MarkSpace-*-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: MarkSpace-*-aarch64-apple-darwin.zip
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: MarkSpace-*-x86_64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y gcc g++ clang libfontconfig-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 二进制 + .desktop 启动器 + 图标 + 用户级安装脚本
          mkdir -p dist
          cp target/release/MarkSpace dist/
          cp packaging/linux/MarkSpace.desktop packaging/linux/install.sh dist/
          cp assets/app.png dist/MarkSpace.png
          chmod +x dist/MarkSpace dist/install.sh
          tar czf "MarkSpace-${VERSION}-${{ matrix.target }}.tar.gz" -C dist .

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 组装 MarkSpace.app（二进制 + AppIcon.icns + Info.plist）
          chmod +x packaging/macos/bundle.sh
          packaging/macos/bundle.sh target/release/MarkSpace "$VERSION" .
          # ditto 保留 .app 目录结构与资源分支
          ditto -c -k --sequesterRsrc --keepParent MarkSpace.app \
            "MarkSpace-${VERSION}-${{ matrix.target }}.zip"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          Compress-Archive -Path "target\release\MarkSpace.exe" `
            -DestinationPath "MarkSpace-$Version-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkSpace-${{ matrix.target }}
          path: ${{ matrix.archive }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
