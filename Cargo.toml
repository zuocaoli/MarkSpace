[package]
name = "MarkSpace"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
# gpui-component 直接引用本地 vendored 副本（vendor/），内含 MarkSpace 对
# dock 省略号菜单的移除补丁；升级上游时同步重新拷贝并保留补丁
gpui-component = { path = "vendor/gpui-component/crates/ui" }
gpui-component-assets = { path = "vendor/gpui-component/crates/assets" } # 图标资源,可选
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 窗口图标解码（PNG → RgbaImage 供 WindowOptions.icon）；版本与 gpui 内部一致，
# 仅启用 png 编解码，不引入额外 codecs
image = { version = "0.25", default-features = false, features = ["png"] }

# Windows 构建时把图标/版本信息嵌入 .exe（build.rs）；仅 Windows 目标拉取
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# 发布构建：thin LTO + 单代码生成单元最大化优化；strip 减小分发体积
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
